name: Payment API Support Lab CI

on:
  push:
    paths:
      - 'labs/payment-api-production-support-lab/**'
      - '.github/workflows/payment-api-support-lab-ci.yml'
  pull_request:
    paths:
      - 'labs/payment-api-production-support-lab/**'
      - '.github/workflows/payment-api-support-lab-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/payment-api-production-support-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: labs/payment-api-production-support-lab/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
