name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run check:version
      - name: Vendor pinned MapLibre
        run: |
          npm install --no-save --package-lock=false maplibre-gl@6.12.0
          mkdir -p public/jaragua-atlas/vendor
          cp node_modules/maplibre-gl/dist/maplibre-gl.js public/jaragua-atlas/vendor/maplibre-gl.js
          cp node_modules/maplibre-gl/dist/maplibre-gl.css public/jaragua-atlas/vendor/maplibre-gl.css
      - run: node --check public/jaragua-atlas/app.js && node --check public/jaragua-atlas/data/elections.js
      - run: python -m py_compile scripts/build-jaragua-geodata.py scripts/build-jaragua-2022.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pyshp==2.3.1
      - run: python scripts/build-jaragua-geodata.py
      - run: python scripts/build-jaragua-2022.py
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: dist
  deploy:
    if: github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
