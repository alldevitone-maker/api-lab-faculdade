services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d payments_lab"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - payments_lab_data:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://lab:lab@db:5432/payments_lab
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  payments_lab_data:
